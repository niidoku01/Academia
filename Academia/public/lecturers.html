<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia - Lecturer Portraits</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="top-bar">
        <button class="mobile-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
        <h1>Lecturer Portrait</h1>
      </div>
      <div class="content-area">
        <div class="filter-bar">
          <select id="lecturer-school-filter" onchange="loadLecturers()">
            <option value="">All Schools</option>
            <option>University for Development Studies</option>
            <option>University of Education, Winneba</option>
            <option>Ghana Institute of Management and Public Administration</option>
            <option>University of Mines and Technology</option>
            <option>University of Health and Allied Sciences</option>
            <option>University of Energy and Natural Resources</option>
            <option>Ghana Communication Technology University</option>
            <option>University of Ghana</option>
            <option>University of Cape Coast</option>
            <option>Kwame Nkrumah University of Science and Technology</option>
            <option>University of Professional Studies, Accra</option>
            <option>Central University</option>
          </select>
          <input type="text" id="lecturer-search" placeholder="Search lecturers..." oninput="loadLecturers()" style="flex:1;min-width:200px">
        </div>
        <div id="lecturers-grid" class="auto-grid"></div>
      </div>
    </main>
  </div>

  <!-- View Lecturer Detail Modal -->
  <div class="modal-overlay" id="lecturer-detail-modal">
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h2 id="lecturer-detail-name"></h2>
        <button class="modal-close" onclick="hideModal('lecturer-detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="lecturer-detail-body"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (checkAuth()) {
      renderSidebar('lecturers');
      loadLecturers();
    }

    async function loadLecturers() {
      showLoading('lecturers-grid', 'Loading lecturers...');
      const school = document.getElementById('lecturer-school-filter').value;
      const search = document.getElementById('lecturer-search').value;
      const params = new URLSearchParams();
      if (school) params.set('school', school);
      if (search) params.set('search', search);
      const lecturers = await apiGet('/api/profiles/lecturers?' + params.toString());
      if (!lecturers) return;
      const grid = document.getElementById('lecturers-grid');
      if (lecturers.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon"><i data-lucide="users"></i></div><h3>No Lecturers Found</h3><p>No lecturer profiles match your criteria.</p></div>';
        lucide.createIcons();
        return;
      }
      grid.innerHTML = lecturers.map(l => `
        <div class="glass-card" style="overflow:hidden;cursor:pointer" onclick="viewLecturer(${l.id})">
          <div style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));padding:28px;text-align:center;color:white">
            ${l.photo_path
              ? `<img src="${l.photo_path}" alt="${l.full_name}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.3);margin-bottom:12px">`
              : `<div style="width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.15);display:inline-flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;margin-bottom:12px;border:3px solid rgba(255,255,255,0.3)">${l.full_name.split(' ').map(n=>n[0]).join('').substring(0,2)}</div>`
            }
            <h3 style="font-size:1.1rem;margin-bottom:4px">${l.full_name}</h3>
            <p style="font-size:0.85rem;opacity:0.85">${l.department || ''} ${l.school ? '&middot; ' + getSchoolShort(l.school) : ''}</p>
          </div>
          <div style="padding:18px 22px">
            ${l.specialization ? `<div style="margin-bottom:6px"><strong style="font-size:0.78rem;color:var(--text-secondary)">Specialization</strong><p style="margin:2px 0 0;font-size:0.9rem">${l.specialization}</p></div>` : ''}
            ${l.qualification ? `<div style="margin-bottom:6px"><strong style="font-size:0.78rem;color:var(--text-secondary)">Qualification</strong><p style="margin:2px 0 0;font-size:0.9rem">${l.qualification}</p></div>` : ''}
            <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;font-size:0.85rem">
              ${l.email ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><i data-lucide="mail" style="width:14px;height:14px;color:var(--text-secondary)"></i>${l.email}</div>` : ''}
              ${l.phone ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><i data-lucide="phone" style="width:14px;height:14px;color:var(--text-secondary)"></i>${l.phone}</div>` : ''}
              ${l.office_location ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><i data-lucide="map-pin" style="width:14px;height:14px;color:var(--text-secondary)"></i>${l.office_location}</div>` : ''}
              ${l.office_hours ? `<div style="display:flex;align-items:center;gap:8px"><i data-lucide="clock" style="width:14px;height:14px;color:var(--text-secondary)"></i>${l.office_hours}</div>` : ''}
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function viewLecturer(userId) {
      const l = await apiGet('/api/profiles/lecturers/' + userId);
      if (!l) return;
      document.getElementById('lecturer-detail-name').textContent = l.full_name;
      document.getElementById('lecturer-detail-body').innerHTML = `
        <div style="text-align:center;margin-bottom:20px">
          ${l.photo_path
            ? `<img src="${l.photo_path}" alt="${l.full_name}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);margin-bottom:12px">`
            : `<div style="width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:inline-flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700;color:white;margin-bottom:12px">${l.full_name.split(' ').map(n=>n[0]).join('').substring(0,2)}</div>`
          }
          <h3 style="font-size:1.15rem">${l.full_name}</h3>
          <p style="color:var(--text-secondary);font-size:0.9rem">${l.department || ''} ${l.school ? '&middot; ' + l.school : ''}</p>
        </div>
        ${l.specialization ? `<div style="margin-bottom:12px"><strong style="font-size:0.82rem;color:var(--text-secondary)">Specialization</strong><p style="margin:4px 0 0">${l.specialization}</p></div>` : ''}
        ${l.qualification ? `<div style="margin-bottom:12px"><strong style="font-size:0.82rem;color:var(--text-secondary)">Qualification</strong><p style="margin:4px 0 0">${l.qualification}</p></div>` : ''}
        ${l.bio ? `<div style="margin-bottom:12px"><strong style="font-size:0.82rem;color:var(--text-secondary)">Bio</strong><p style="margin:4px 0 0;line-height:1.6">${l.bio}</p></div>` : ''}
        <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px">
          <h4 style="font-size:0.9rem;margin-bottom:10px">Contact Information</h4>
          ${l.email ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.9rem"><i data-lucide="mail" style="width:16px;height:16px;color:var(--primary)"></i>${l.email}</div>` : ''}
          ${l.phone ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.9rem"><i data-lucide="phone" style="width:16px;height:16px;color:var(--primary)"></i>${l.phone}</div>` : ''}
          ${l.office_location ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.9rem"><i data-lucide="map-pin" style="width:16px;height:16px;color:var(--primary)"></i>${l.office_location}</div>` : ''}
          ${l.office_hours ? `<div style="display:flex;align-items:center;gap:10px;font-size:0.9rem"><i data-lucide="clock" style="width:16px;height:16px;color:var(--primary)"></i>${l.office_hours}</div>` : ''}
        </div>
      `;
      showModal('lecturer-detail-modal');
      lucide.createIcons();
    }

  </script>
</body>
</html>
