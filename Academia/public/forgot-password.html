<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia - Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      padding: 20px;
    }
    .reset-shell {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .reset-head {
      background: var(--primary);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .reset-body { padding: 24px; }
    .reset-body .field { margin-bottom: 16px; }
    .reset-body label { display: block; margin-bottom: 6px; font-weight: 700; }
    .reset-body input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
    .reset-body input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    .reset-body .action { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="reset-shell">
    <div class="reset-head">
      <div style="font-size:2rem;font-weight:900;letter-spacing:2px">ACADEMIA</div>
      <div style="opacity:0.85;margin-top:4px">Reset your password</div>
    </div>
    <div class="reset-body">
      <div id="reset-msg" class="success-msg" style="display:none"></div>
      <div id="reset-err" class="error-msg" style="display:none"></div>
      <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:16px">Enter your email address and we'll send you a link to reset your password.</p>
      <form id="forgot-form">
        <div class="field">
          <label for="fp-email">Email Address</label>
          <input id="fp-email" type="email" placeholder="you@email.com" required>
        </div>
        <button class="btn btn-primary action" type="submit" id="fp-btn">Send Reset Link</button>
      </form>
      <p style="margin-top:16px;text-align:center;font-size:0.85rem"><a href="/" style="color:var(--primary);font-weight:700;text-decoration:none">Back to Login</a></p>
    </div>
  </div>
  <script>
    lucide.createIcons();
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('fp-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('fp-email').value })
        });
        const data = await res.json();
        document.getElementById('reset-msg').textContent = data.message || 'Check your email for the reset link.';
        document.getElementById('reset-msg').style.display = 'block';
        document.getElementById('reset-err').style.display = 'none';
        btn.textContent = 'Sent!';
      } catch {
        document.getElementById('reset-err').textContent = 'Something went wrong. Please try again.';
        document.getElementById('reset-err').style.display = 'block';
        document.getElementById('reset-msg').style.display = 'none';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
